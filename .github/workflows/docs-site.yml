# Deploy public docs-site/ to GitHub Pages (#2906).
# Day-one URL: https://deftai.github.io/directive/
# Operator: Settings → Pages → Source = GitHub Actions (one-time).
# deft.md custom-domain cutover remains operator DNS; see
# docs/decisions/ADR-docs-site-hosting.md.

name: Deploy docs site

on:
  push:
    branches: [master]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs-site
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always publish master — workflow_dispatch must not ship a feature branch.
          ref: master

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
