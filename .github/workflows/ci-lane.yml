# Reusable CI lane for the framework TypeScript suite (#2672).
# Called from ci.yml as Blacksmith-primary or GH-hosted failover.
# Job check names here are NOT branch-protection required names — those live
# exclusively on the aggregators in ci.yml.

name: CI lane

on:
  workflow_call:
    inputs:
      suite:
        description: "Which suite to run (ts)"
        required: true
        type: string
      runner:
        description: "GitHub Actions runs-on label"
        required: true
        type: string

permissions:
  contents: read

env:
  DEFT_SESSION_RITUAL_SKIP: "1"

jobs:
  run:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (ts)
        if: inputs.suite == 'ts'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        if: inputs.suite == 'ts'
        run: corepack enable

      - name: Install dependencies
        if: inputs.suite == 'ts'
        run: pnpm install --frozen-lockfile

      # --- TypeScript suite ---
      - name: Build (tsc -b project references)
        if: inputs.suite == 'ts'
        run: pnpm run build

      - name: Lint + format check (biome)
        if: inputs.suite == 'ts'
        run: pnpm run lint

      - name: Rule-relocation eval:health gate (#2373)
        if: inputs.suite == 'ts' && github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          node packages/runtime/dist/bin.js verify:eval-health-relocation --project-root . --base-ref "origin/${{ github.base_ref }}"

      - name: Trigger-routing eval:triggers gate (#1586)
        if: inputs.suite == 'ts' && github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          node packages/runtime/dist/bin.js verify:eval-triggers-relocation --project-root . --base-ref "origin/${{ github.base_ref }}"
