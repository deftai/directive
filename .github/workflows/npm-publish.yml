name: npm publish

# Canonical v1 distribution channel for @deftai/directive* (#1670 Decision-4).
# pip/PyPI publish is explicitly out of scope for v1 — deferred to #1084.

on:
  push:
    tags:
      - "v*"
  # Manual re-publish of an existing tag without tag surgery (#1916). Use when a
  # tag-triggered run failed and the fix lives on a later commit: dispatch with
  # the tag to (re)publish, e.g. v0.55.0.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v0.55.0"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish @deftai/directive* to npm
    # GitHub-hosted runner is REQUIRED for npm --provenance (#1916): the registry
    # rejects Sigstore provenance bundles signed on self-hosted / third-party
    # runners (e.g. Blacksmith) with HTTP 422 "Unsupported ... runner
    # environment: self-hosted". Do NOT move this job to a Blacksmith runner.
    runs-on: ubuntu-latest
    # REF_NAME unifies the tag source across both triggers: github.ref_name for a
    # push-tag run, inputs.tag for a manual workflow_dispatch re-publish.
    env:
      REF_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Node 24 LTS pinned via .nvmrc (npm >= 11.5.1 ships with it, required for
      # OIDC trusted publishing). registry-url points npm at the public registry.
      # id-token: write (workflow permissions) is used for BOTH the OIDC publish
      # auth (no NPM_TOKEN needed, #1919) and the --provenance attestations.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -w run build

      - name: Align package versions with release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          echo "Publishing npm packages at version ${VERSION}"
          for dir in packages/types packages/core packages/content packages/cli; do
            npm version "${VERSION}" --no-git-tag-version --allow-same-version --prefix "${dir}"
          done

      - name: Resolve workspace protocol for npm publish
        shell: bash
        env:
          VERSION: ${{ env.REF_NAME }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          node --input-type=commonjs -e "
            const fs = require('node:fs');
            const semver = '^' + process.env.VERSION;
            for (const path of ['packages/core/package.json', 'packages/cli/package.json']) {
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (pkg.dependencies) {
                for (const [name, ver] of Object.entries(pkg.dependencies)) {
                  if (typeof ver === 'string' && ver.startsWith('workspace:')) {
                    pkg.dependencies[name] = semver;
                  }
                }
              }
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

      # Dependency order: types -> core -> content -> cli
      # Idempotent re-publish (#1916): if a prior tag run partially succeeded (e.g.
      # OIDC flake on the final package), workflow_dispatch / --failed rerun must
      # not fail on E409 for packages already at this version.
      - name: Publish @deftai/directive-types
        working-directory: packages/types
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          npm publish --provenance --access public || {
            npm view "${PKG}@${VER}" version >/dev/null
            echo "Already published ${PKG}@${VER}, continuing"
          }

      - name: Publish @deftai/directive-core
        working-directory: packages/core
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          npm publish --provenance --access public || {
            npm view "${PKG}@${VER}" version >/dev/null
            echo "Already published ${PKG}@${VER}, continuing"
          }

      - name: Publish @deftai/directive-content
        working-directory: packages/content
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          npm publish --provenance --access public || {
            npm view "${PKG}@${VER}" version >/dev/null
            echo "Already published ${PKG}@${VER}, continuing"
          }

      - name: Publish @deftai/directive
        working-directory: packages/cli
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          npm publish --provenance --access public || {
            npm view "${PKG}@${VER}" version >/dev/null
            echo "Already published ${PKG}@${VER}, continuing"
          }
