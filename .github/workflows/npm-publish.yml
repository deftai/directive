name: npm publish

# Canonical v1 distribution channel for @deftai/directive* (#1670 Decision-4).
# pip/PyPI publish is explicitly out of scope for v1 — deferred to #1084.
#
# Prefer-A Bound #5365 (comment 6050330747): Environment `npm` + trusted-publisher
# bind (operator forge steps) before merge; tag glob v*.*.*; tag/dispatch identity;
# prepare/pack without id-token; OIDC publish consumes same-run tarballs only;
# post-publish fixture is a downstream non-OIDC job. Provenance stays GitHub-hosted
# forensics, not an authorization control.

on:
  push:
    tags:
      - "v*.*.*"
  # Manual re-publish of an existing tag without tag surgery (#1916). Use when a
  # tag-triggered run failed and the fix lives on a later commit: dispatch from
  # master with the tag to (re)publish, e.g. v0.55.0. Workflow ref is constrained
  # separately from the payload tag (#5365 limb 3).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v0.55.0"
        required: true
        type: string

# Default-deny: no workflow-level id-token (#5365 limb 4 / Reject E).
permissions:
  contents: read

jobs:
  prepare:
    name: Prepare and pack @deftai/directive*
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      dist_tag: ${{ steps.identity.outputs.dist_tag }}
      source_sha: ${{ steps.peel.outputs.source_sha }}
    steps:
      - name: Resolve tag name, SemVer, and dist-tag (#5365)
        id: identity
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${GITHUB_REF}" in
              refs/heads/master) ;;
              *)
                echo "::error::workflow_dispatch must run from refs/heads/master (got ${GITHUB_REF})"
                exit 1
                ;;
            esac
            TAG="${INPUT_TAG}"
          else
            case "${GITHUB_REF}" in
              refs/tags/*) ;;
              *)
                echo "::error::push trigger expected refs/tags/* (got ${GITHUB_REF})"
                exit 1
                ;;
            esac
            TAG="${GITHUB_REF_NAME}"
          fi
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::tag must match v*.*.* (got ${TAG})"
              exit 1
              ;;
          esac
          VERSION="${TAG#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)*$ ]]; then
            echo "::error::VERSION ${VERSION} is not SemVer"
            exit 1
          fi
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            DIST_TAG=latest
          elif [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-([0-9A-Za-z]+) ]]; then
            PRE="${BASH_REMATCH[1]}"
            # npm rejects dist-tags that are valid version ranges (e.g. "1" from v1.2.3-1).
            if [[ "${PRE}" =~ ^[0-9]+$ ]]; then
              DIST_TAG=next
            else
              DIST_TAG="${PRE}"
            fi
          else
            DIST_TAG=next
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "dist_tag=${DIST_TAG}"
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved tag=${TAG} version=${VERSION} dist_tag=${DIST_TAG}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.identity.outputs.tag }}

      - name: Peel tag SHA and verify master ancestry (#5365)
        id: peel
        shell: bash
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          SOURCE_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
          MASTER_SHA="$(git rev-parse origin/master)"
          if [ "${SOURCE_SHA}" != "${MASTER_SHA}" ] \
            && ! git merge-base --is-ancestor "${SOURCE_SHA}" origin/master; then
            echo "::error::tag ${TAG} (${SOURCE_SHA}) is not on origin/master ancestry (${MASTER_SHA})"
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "OK: ${TAG} -> ${SOURCE_SHA} (master ${MASTER_SHA})"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -w run build

      - name: Align package versions with release tag
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          echo "Packing npm packages at version ${VERSION}"
          # AC13.4: only launcher + runtime are published. Private workspace
          # packages (types/core/content) stay version-aligned for the monorepo build.
          for dir in packages/types packages/core packages/content packages/runtime packages/cli; do
            npm version "${VERSION}" --no-git-tag-version --allow-same-version --prefix "${dir}"
          done

      - name: Prepare launcher + stage self-contained runtime (AC13.4)
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          # Launcher must ship with empty deps (AC3.1).
          node --input-type=commonjs -e "
            const fs = require('node:fs');
            const launcher = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
            launcher.dependencies = {};
            delete launcher.devDependencies;
            fs.writeFileSync('packages/cli/package.json', JSON.stringify(launcher, null, 2) + '\n');
          "
          # Vendor private core/content/types into a pack stage (no registry deps on them).
          STAGE="$(node packages/runtime/scripts/stage-bundle.mjs)"
          echo "STAGE=${STAGE}" >> "${GITHUB_ENV}"
          VERSION="${VERSION}" STAGE="${STAGE}" node --input-type=commonjs -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const ver = process.env.VERSION;
            const stage = process.env.STAGE;
            const pkgPath = path.join(stage, 'package.json');
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = ver;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
            // PKG-AC13-NEST: private pkgs live under vendor/ without package.json — no nested version bump.
          "

      - name: Pack two @deftai packages (launcher + runtime)
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p tarballs
          test -n "${STAGE:-}" && test -d "${STAGE}"
          # AC1.3: pack helper embeds vendored node_modules then strips @deftai/* from deps.
          node packages/runtime/scripts/pack-staged-runtime.mjs "${STAGE}" "${GITHUB_WORKSPACE}/tarballs"
          (cd packages/cli && npm pack --pack-destination "${GITHUB_WORKSPACE}/tarballs")
          ls -la tarballs
          test -f "tarballs/deftai-directive-runtime-${VERSION}.tgz"
          test -f "tarballs/deftai-directive-${VERSION}.tgz"
          # AC3.1 + AC1.3 + D4.3 + AC13.4: launcher empty deps / single JS bin +
          # PATH shims; runtime has no @deftai deps and vendors under vendor/ (no
          # nested node_modules/@deftai/*/package.json).
          node --input-type=commonjs -e "
            const {execSync}=require('node:child_process');
            const ver=process.env.VERSION;
            const launcher=JSON.parse(execSync('tar -xOf '+JSON.stringify('tarballs/deftai-directive-'+ver+'.tgz')+' package/package.json',{encoding:'utf8'}));
            if (Object.keys(launcher.dependencies||{}).length!==0) {
              console.error('AC3.1 fail: launcher deps not empty', launcher.dependencies);
              process.exit(1);
            }
            if (!launcher.bin || launcher.bin.directive!=='./dist/bin.js' || launcher.bin.deft!=='./dist/bin.js' || launcher.bin['deft-hook']!=='./bin/deft-hook') {
              console.error('D4.3/AC3.5 fail: launcher bin map', launcher.bin);
              process.exit(1);
            }
            const launcherListing=execSync('tar -tzf '+JSON.stringify('tarballs/deftai-directive-'+ver+'.tgz'),{encoding:'utf8'});
            const launcherEntries=launcherListing.split('\n').filter(Boolean);
            const launcherJs=launcherEntries.filter(n=>n.endsWith('.js')&&!n.endsWith('.js.map')).sort();
            if (launcherJs.join('\n')!=='package/dist/bin.js') {
              console.error('D4.3 fail: expected exactly one launcher JS', launcherJs);
              process.exit(1);
            }
            if (launcherEntries.some(n=>n.includes('hook-bin'))) {
              console.error('D4.3 fail: legacy hook-bin present in launcher tarball');
              process.exit(1);
            }
            for (const need of ['package/bin/deft-hook','package/bin/deft-hook.cmd']) {
              if (!launcherEntries.includes(need)) {
                console.error('AC3.5 fail: missing PATH shim', need);
                process.exit(1);
              }
            }
            const runtime=JSON.parse(execSync('tar -xOf '+JSON.stringify('tarballs/deftai-directive-runtime-'+ver+'.tgz')+' package/package.json',{encoding:'utf8'}));
            if (!runtime.directive || runtime.directive.contract!==1) {
              console.error('runtime missing contract', runtime.directive);
              process.exit(1);
            }
            const deftaiDeps=Object.keys(runtime.dependencies||{}).filter(k=>k.startsWith('@deftai/'));
            if (deftaiDeps.length!==0) {
              console.error('AC1.3 fail: runtime dependencies contain @deftai/*', deftaiDeps);
              process.exit(1);
            }
            if (runtime.bundledDependencies) {
              console.error('AC1.3 fail: runtime still declares bundledDependencies', runtime.bundledDependencies);
              process.exit(1);
            }
            const listing=execSync('tar -tzf '+JSON.stringify('tarballs/deftai-directive-runtime-'+ver+'.tgz'),{encoding:'utf8'});
            const names=listing.split('\n');
            for (const nested of [
              'package/node_modules/@deftai/directive-core/package.json',
              'package/node_modules/@deftai/directive-content/package.json',
              'package/node_modules/@deftai/directive-types/package.json',
              'package/vendor/directive-core/package.json',
              'package/vendor/directive-content/package.json',
              'package/vendor/directive-types/package.json',
            ]) {
              if (names.includes(nested)) {
                console.error('AC1.3 fail: nested package.json must be absent', nested);
                process.exit(1);
              }
            }
            for (const prefix of [
              'package/vendor/directive-core/',
              'package/vendor/directive-content/',
              'package/vendor/directive-types/',
            ]) {
              if (!names.some(n=>n.startsWith(prefix))) {
                console.error('AC13.4 fail: missing vendor tree', prefix);
                process.exit(1);
              }
            }
            console.log('AC3.1 + AC1.3 + D4.3 + AC13.4 ok');
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs-${{ steps.identity.outputs.version }}
          path: tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

      # Post-publish runner: built at the peeled tag SHA in this job so the
      # downstream fixture never checkouts source_sha + pnpm install (CodeQL
      # actions/cache-poisoning/poisonable-step under workflow_dispatch).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-publish-runner-${{ steps.identity.outputs.version }}
          path: |
            packages/core/package.json
            packages/core/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish @deftai/directive* to npm
    needs: prepare
    # GitHub-hosted runner is REQUIRED for npm --provenance (#1916 / #5365 limb 5):
    # the registry rejects Sigstore provenance bundles signed on self-hosted /
    # third-party runners. Do NOT move this job to a Blacksmith runner.
    # Provenance is forensics / post-hoc attestation, not an authorization control.
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      # Checkout the validated source SHA only for working-directory layout /
      # package.json name reads. No install, build, or script execution here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs-${{ needs.prepare.outputs.version }}
          path: tarballs

      # AC13.4: publish only launcher + runtime (same version).
      # Idempotent re-publish (#1916): if a prior tag run partially succeeded,
      # workflow_dispatch / --failed rerun must not fail on E409 for packages
      # already at this version. Lifecycle scripts suppressed on tarball publish.
      - name: Publish @deftai/directive-runtime
        working-directory: packages/runtime
        shell: bash
        run: |
          set -euo pipefail
          TGZ="${GITHUB_WORKSPACE}/tarballs/deftai-directive-runtime-${VERSION}.tgz"
          test -f "${TGZ}"
          PKG=$(node -p "require('./package.json').name")
          npm publish --provenance --access public --tag "${DIST_TAG}" --ignore-scripts "${TGZ}" || {
            npm view "${PKG}@${VERSION}" version >/dev/null
            echo "Already published ${PKG}@${VERSION}, continuing"
          }

      - name: Publish @deftai/directive
        working-directory: packages/cli
        shell: bash
        run: |
          set -euo pipefail
          TGZ="${GITHUB_WORKSPACE}/tarballs/deftai-directive-${VERSION}.tgz"
          test -f "${TGZ}"
          PKG=$(node -p "require('./package.json').name")
          npm publish --provenance --access public --tag "${DIST_TAG}" --ignore-scripts "${TGZ}" || {
            npm view "${PKG}@${VERSION}" version >/dev/null
            echo "Already published ${PKG}@${VERSION}, continuing"
          }

  post-publish:
    name: Post-publish two-pass fixture
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Bound-remedy 4 (#4271 / #4398 / #5365): after the two packages publish,
      # run the two-pass fixture from a non-OIDC job. Do not checkout
      # needs.prepare.outputs.source_sha then pnpm install/build — that is
      # CodeQL actions/cache-poisoning/poisonable-step under workflow_dispatch
      # default-branch context. Consume the prepare-built runner artifact only.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: post-publish-runner-${{ needs.prepare.outputs.version }}
          # upload-artifact strips the shared packages/core prefix, so the
          # archive is package.json + dist/; restore that root here.
          path: packages/core

      - name: Post-publish two-pass fixture (#4271)
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/core/dist/release-e2e/npm-ops.js
          node ./packages/core/dist/release-e2e/npm-ops.js --post-publish-two-pass "${VERSION}"
