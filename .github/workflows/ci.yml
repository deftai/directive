name: CI

on:
  pull_request:
  push:
    branches: [master]

# actions:read — capacity-watchdog + aggregators poll job status for this run (#2672).
permissions:
  contents: read
  actions: read

env:
  # #1348: CI is a headless worker context. The session ritual verifier
  # remains fail-closed for interactive implementation dispatch but CI
  # bypasses it explicitly so workflow jobs do not need per-clone state.
  DEFT_SESSION_RITUAL_SKIP: "1"
  # Pinned ghx version (#884). Bump in lockstep with
  # `scripts/setup_ghx.py::GHX_VERSION` so the consent-gated installer
  # and the CI pre-install step never disagree on which release the
  # project recommends. v1.5.1 (2026-04-17) is the first release
  # carrying the Windows install.ps1 + agent-plugin shim contract
  # documented in the upstream README.
  GHX_VERSION: v1.5.1
  # Supply-chain hardening (#1070): SHA256 of the upstream installer
  # scripts at the pinned ${GHX_VERSION} tag. The CI steps below
  # download the installer to a temp file, verify it matches the
  # checksum, and ONLY THEN execute it -- replacing the prior
  # `curl | bash` and `irm | iex` live-pipe patterns that executed
  # remote code without inspection. Bump these in lockstep with
  # `GHX_VERSION`; the upstream release tag is immutable so a SHA
  # mismatch in a future CI run unambiguously means the upstream
  # tag was force-moved (supply-chain compromise signal).
  GHX_INSTALL_SH_SHA256: 08c768feb6d2bc485079898f7e76c2b07576cbb1188a356acf99dac0fc55d1cb
  GHX_INSTALL_PS1_SHA256: 5f67eab68970ecc55bb0fc1b8399ba6f3ce4b2aadeee39255d628e96d187a5ed
  # #2672 / #3168 / #3340: Blacksmith capacity-stall budget before GH-hosted failover.
  # Unclaimed = no runner_name (started_at or reusable-workflow caller in_progress
  # is not a claim). Arm when a required primary is still unclaimed past budget
  # OR cancelled/skipped with no runner. Claimed runners are NOT failed over (#2652).
  CI_CAPACITY_STALL_SECONDS: "1200"
  CI_CAPACITY_POLL_SECONDS: "30"

jobs:
  # -------------------------------------------------------------------------
  # Job / check name map (#3168) — branch-protection SoT is AGGREGATORS only.
  #
  # | Role        | Workflow job id      | Display / check name                    | Required? |
  # |-------------|----------------------|-----------------------------------------|-----------|
  # | Predicate   | changes              | Changes (artifact-only predicate)       | no        |
  # | Primary TS  | ts-primary           | TypeScript (Blacksmith primary)         | no        |
  # | Primary Go  | go-primary           | Go (Blacksmith primary)                 | no        |
  # | Primary MG  | merge-gate-primary   | Merge gate (Blacksmith primary)         | no        |
  # | Watchdog    | capacity-watchdog    | Capacity watchdog                       | no        |
  # | Arm decision| capacity-arm         | Capacity arm (failover decision)        | no        |
  # | Failover TS | ts-failover          | TypeScript (GH-hosted failover)         | no        |
  # | Failover Go | go-failover          | Go (GH-hosted failover)                 | no        |
  # | Failover MG | merge-gate-failover  | Merge gate (GH-hosted failover)         | no        |
  # | Aggregator  | ts                   | TypeScript (build + lint + test)        | YES       |
  # | Aggregator  | go                   | Go (test + build)                       | no        |
  # | Aggregator  | merge-gate           | Merge gate (task check)                 | no        |
  #
  # Live branch protection requires ONLY the TypeScript aggregator.
  # Go and merge-gate aggregators are not required; they skip on diffs
  # confined to {xbrief/completed/**, CHANGELOG.md} (#3678).
  # Primary/failover lane names must never be branch-protection required checks.
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # Blacksmith primary lanes (#2672). Names are NOT the branch-protection
  # required checks — those live only on the aggregators below.
  # No concurrency group on these caller jobs (invalidates workflow_call graphs).
  # -------------------------------------------------------------------------
  # Merge-base predicate for leftover-completion diffs (#3678). Fail closed:
  # any error or empty/unusable base routes to the full stack (artifact_only=false).
  # Do NOT copy this as workflow-level paths: — the required TS aggregator
  # must still report. Allowlist widening is a gate change, not maintenance.
  changes:
    name: Changes (artifact-only predicate)
    runs-on: ubuntu-latest
    outputs:
      artifact_only: ${{ steps.predicate.outputs.artifact_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute artifact-only predicate against merge base
        id: predicate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          artifact_only=false
          ZERO="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" || true
            BASE="origin/${BASE_REF}"
            TIP="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"
            TIP="$HEAD_SHA"
          else
            echo "Unknown event ${EVENT_NAME}; routing to full stack"
            echo "artifact_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BASE:-}" ] || [ "$BASE" = "$ZERO" ] || [ "$BASE" = "origin/" ] || [ -z "${TIP:-}" ]; then
            echo "Unusable merge-base (base=${BASE:-empty} tip=${TIP:-empty}); routing to full stack"
            echo "artifact_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: name-only otherwise emits only the destination of a
          # rename into the allowlist and would skip optional jobs (#3678 P2).
          files="$(git diff --name-only --no-renames --diff-filter=ACDMRT "${BASE}...${TIP}" || true)"
          printf '%s\n' "$files"
          result="$(printf '%s\n' "$files" | node .github/scripts/artifact-only-lifecycle.mjs --stdin || true)"
          echo "$result"
          case "$result" in
            artifact_only=true) artifact_only=true ;;
            *) artifact_only=false ;;
          esac
          echo "artifact_only=${artifact_only}" >> "$GITHUB_OUTPUT"

  ts-primary:
    name: TypeScript (Blacksmith primary)
    uses: ./.github/workflows/ci-lane.yml
    with:
      suite: ts
      runner: blacksmith-4vcpu-ubuntu-2404

  go-primary:
    name: Go (Blacksmith primary)
    needs: [changes]
    if: always() && needs.changes.outputs.artifact_only != 'true'
    uses: ./.github/workflows/ci-lane.yml
    with:
      suite: go
      runner: blacksmith-4vcpu-ubuntu-2404

  merge-gate-primary:
    name: Merge gate (Blacksmith primary)
    needs: [changes]
    if: always() && needs.changes.outputs.artifact_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base branch for relocation gates
        run: git fetch origin master:refs/remotes/origin/master

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go (toolchain gate in task check)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup uv (toolchain gate in task check)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: task check:merge (merge chokepoint SoT — #1704)
        run: task check:merge
        env:
          GH_TOKEN: ${{ github.token }}
          # #3499 / #747: merge-gate CI is a read-only verification checkout,
          # not authoring. Documented exemption only. Local `task check` /
          # hooks stay fail-closed on master.
          DEFT_ALLOW_DEFAULT_BRANCH_COMMIT: "1"

  # -------------------------------------------------------------------------
  # Capacity watchdog: GH-hosted, independent of primary job cancellation
  # (no needs: on primaries; cancel API targets only Blacksmith primary names).
  # ~20m budget for queued/missing; immediate arm on cancelled_unclaimed (#3168).
  # Never skip while TS, Go, or merge-gate is unclaimed (#3340).
  # Never failover a job with runner_name (#2652).
  # -------------------------------------------------------------------------
  capacity-watchdog:
    name: Capacity watchdog
    needs: [changes]
    if: always()
    runs-on: ubuntu-latest
    # Isolate from primary-lane cancel thrash: this job never needs: primaries
    # and is not selected by cancel-queued-ci-primary.mjs needles.
    # Artifact-only diffs still start the TS primary, so this job still runs;
    # it must not treat skipped Go/merge-gate jobs as capacity death (#3678).
    outputs:
      ts_failover: ${{ steps.poll.outputs.ts_failover }}
      go_failover: ${{ steps.poll.outputs.go_failover }}
      merge_failover: ${{ steps.poll.outputs.merge_failover }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Poll Blacksmith primary queue state
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
          STALL_BUDGET_SECONDS: ${{ env.CI_CAPACITY_STALL_SECONDS }}
          POLL_SECONDS: ${{ env.CI_CAPACITY_POLL_SECONDS }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          ARTIFACT_ONLY: ${{ needs.changes.outputs.artifact_only }}
        run: |
          set -euo pipefail
          ts_failover=false
          go_failover=false
          merge_failover=false
          echo "Stall budget=${STALL_BUDGET_SECONDS}s poll=${POLL_SECONDS}s run=${RUN_ID} artifact_only=${ARTIFACT_ONLY}"

          while true; do
            jobs_json="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100")"
            ts_state="$(node .github/scripts/classify-ci-job-state.mjs "typescript (blacksmith primary)" "$jobs_json")"
            go_state="done"
            merge_state="done"
            if [[ "$ARTIFACT_ONLY" != "true" ]]; then
              go_state="$(node .github/scripts/classify-ci-job-state.mjs "go (blacksmith primary)" "$jobs_json")"
              merge_state="$(node .github/scripts/classify-ci-job-state.mjs "merge gate (blacksmith primary)" "$jobs_json")"
            fi
            echo "state ts=${ts_state} go=${go_state} merge=${merge_state} elapsed=${SECONDS}s artifact_only=${ARTIFACT_ONLY}"

            # #3168: cancelled/skipped without a runner claim = capacity death → arm now.
            if [[ "$ts_state" == "cancelled_unclaimed" ]]; then
              ts_failover=true
            fi
            if [[ "$ARTIFACT_ONLY" != "true" && "$go_state" == "cancelled_unclaimed" ]]; then
              go_failover=true
            fi
            if [[ "$ARTIFACT_ONLY" != "true" && "$merge_state" == "cancelled_unclaimed" ]]; then
              merge_failover=true
            fi

            # Stall budget for still-unclaimed / not-yet-visible primaries (#3340).
            if [[ ( "$ts_state" == "queued" || "$ts_state" == "missing" ) && "$SECONDS" -ge "$STALL_BUDGET_SECONDS" ]]; then
              ts_failover=true
            fi
            if [[ ( "$go_state" == "queued" || "$go_state" == "missing" ) && "$SECONDS" -ge "$STALL_BUDGET_SECONDS" ]]; then
              go_failover=true
            fi
            if [[ ( "$merge_state" == "queued" || "$merge_state" == "missing" ) && "$SECONDS" -ge "$STALL_BUDGET_SECONDS" ]]; then
              merge_failover=true
            fi

            # Pending = still waiting for a runner_name (or job to appear).
            # started/done/cancelled_unclaimed are terminal for the poll loop.
            ts_pending=false
            go_pending=false
            merge_pending=false
            if [[ "$ts_state" == "queued" || "$ts_state" == "missing" ]]; then
              ts_pending=true
            fi
            if [[ "$go_state" == "queued" || "$go_state" == "missing" ]]; then
              go_pending=true
            fi
            if [[ "$merge_state" == "queued" || "$merge_state" == "missing" ]]; then
              merge_pending=true
            fi

            if [[ "$ts_pending" == "false" && "$go_pending" == "false" && "$merge_pending" == "false" ]]; then
              echo "Required primaries claimed, finished, or capacity-cancelled; ts_failover=${ts_failover} go_failover=${go_failover} merge_failover=${merge_failover}"
              break
            fi
            if [[ "$SECONDS" -ge "$STALL_BUDGET_SECONDS" ]]; then
              echo "Stall budget reached; ts_failover=${ts_failover} go_failover=${go_failover} merge_failover=${merge_failover}"
              break
            fi
            sleep "$POLL_SECONDS"
          done

          if [[ "$ts_failover" == "true" || "$go_failover" == "true" || "$merge_failover" == "true" ]]; then
            jobs_json="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100")"
            if [[ "$ts_failover" == "true" ]]; then
              node .github/scripts/cancel-queued-ci-primary.mjs "typescript (blacksmith primary)" "$jobs_json"
            fi
            if [[ "$go_failover" == "true" ]]; then
              node .github/scripts/cancel-queued-ci-primary.mjs "go (blacksmith primary)" "$jobs_json"
            fi
            if [[ "$merge_failover" == "true" ]]; then
              node .github/scripts/cancel-queued-ci-primary.mjs "merge gate (blacksmith primary)" "$jobs_json"
            fi
          fi

          echo "ts_failover=${ts_failover}" >> "$GITHUB_OUTPUT"
          echo "go_failover=${go_failover}" >> "$GITHUB_OUTPUT"
          echo "merge_failover=${merge_failover}" >> "$GITHUB_OUTPUT"
          echo "::notice title=capacity-watchdog (#3168/#3340)::ts_failover=${ts_failover} go_failover=${go_failover} merge_failover=${merge_failover}"

  # -------------------------------------------------------------------------
  # Capacity arm (#3168 / #3340): durable failover decision. Passes through
  # watchdog outputs on success, then ALWAYS re-classifies required primaries
  # so a same-run rerun cannot keep a stale skip while a job is still unclaimed.
  # If the watchdog is cancelled/failed, the same re-classify path arms failover.
  # Never arms for started (runner_name set) — #2652.
  # -------------------------------------------------------------------------
  capacity-arm:
    name: Capacity arm (failover decision)
    needs: [changes, capacity-watchdog]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      ts_failover: ${{ steps.decide.outputs.ts_failover }}
      go_failover: ${{ steps.decide.outputs.go_failover }}
      merge_failover: ${{ steps.decide.outputs.merge_failover }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve failover arm flags
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          WATCHDOG_RESULT: ${{ needs.capacity-watchdog.result }}
          TS_FROM_WD: ${{ needs.capacity-watchdog.outputs.ts_failover }}
          GO_FROM_WD: ${{ needs.capacity-watchdog.outputs.go_failover }}
          MERGE_FROM_WD: ${{ needs.capacity-watchdog.outputs.merge_failover }}
          ARTIFACT_ONLY: ${{ needs.changes.outputs.artifact_only }}
        run: |
          set -euo pipefail
          ts_failover=false
          go_failover=false
          merge_failover=false

          if [[ "$WATCHDOG_RESULT" == "success" ]]; then
            ts_failover="${TS_FROM_WD:-false}"
            go_failover="${GO_FROM_WD:-false}"
            merge_failover="${MERGE_FROM_WD:-false}"
            echo "Pass-through from capacity-watchdog (success): ts=${ts_failover} go=${go_failover} merge=${merge_failover}"
          else
            echo "::warning title=capacity-arm (#3168)::capacity-watchdog result=${WATCHDOG_RESULT}; re-classifying primaries for failover recovery"
          fi

          # #3340: re-evaluate every required Blacksmith job. Do not skip while
          # TS, Go, or merge-gate is still unclaimed (same-run rerun included).
          jobs_json="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100")"
          ts_state="$(node .github/scripts/classify-ci-job-state.mjs "typescript (blacksmith primary)" "$jobs_json")"
          go_state="done"
          merge_state="done"
          if [[ "$ARTIFACT_ONLY" != "true" ]]; then
            go_state="$(node .github/scripts/classify-ci-job-state.mjs "go (blacksmith primary)" "$jobs_json")"
            merge_state="$(node .github/scripts/classify-ci-job-state.mjs "merge gate (blacksmith primary)" "$jobs_json")"
          fi
          echo "re-eval state ts=${ts_state} go=${go_state} merge=${merge_state} artifact_only=${ARTIFACT_ONLY}"

          if [[ "$ts_state" == "queued" || "$ts_state" == "missing" || "$ts_state" == "cancelled_unclaimed" ]]; then
            ts_failover=true
          fi
          if [[ "$ARTIFACT_ONLY" != "true" && ( "$go_state" == "queued" || "$go_state" == "missing" || "$go_state" == "cancelled_unclaimed" ) ]]; then
            go_failover=true
          fi
          if [[ "$ARTIFACT_ONLY" != "true" && ( "$merge_state" == "queued" || "$merge_state" == "missing" || "$merge_state" == "cancelled_unclaimed" ) ]]; then
            merge_failover=true
          fi

          if [[ "$ts_failover" == "true" ]]; then
            node .github/scripts/cancel-queued-ci-primary.mjs "typescript (blacksmith primary)" "$jobs_json"
          fi
          if [[ "$ARTIFACT_ONLY" != "true" && "$go_failover" == "true" ]]; then
            node .github/scripts/cancel-queued-ci-primary.mjs "go (blacksmith primary)" "$jobs_json"
          fi
          if [[ "$ARTIFACT_ONLY" != "true" && "$merge_failover" == "true" ]]; then
            node .github/scripts/cancel-queued-ci-primary.mjs "merge gate (blacksmith primary)" "$jobs_json"
          fi

          # Normalize empty → false (use if/then so set -e does not abort on false [[ ]])
          if [[ -z "$ts_failover" || "$ts_failover" == "null" ]]; then
            ts_failover=false
          fi
          if [[ -z "$go_failover" || "$go_failover" == "null" ]]; then
            go_failover=false
          fi
          if [[ -z "$merge_failover" || "$merge_failover" == "null" ]]; then
            merge_failover=false
          fi
          if [[ "$ARTIFACT_ONLY" == "true" ]]; then
            go_failover=false
            merge_failover=false
          fi

          echo "ts_failover=${ts_failover}" >> "$GITHUB_OUTPUT"
          echo "go_failover=${go_failover}" >> "$GITHUB_OUTPUT"
          echo "merge_failover=${merge_failover}" >> "$GITHUB_OUTPUT"
          if [[ "$ts_failover" == "true" || "$go_failover" == "true" || "$merge_failover" == "true" ]]; then
            echo "::notice title=failover_armed (#3168/#3340)::ts_failover=${ts_failover} go_failover=${go_failover} merge_failover=${merge_failover}"
          else
            echo "::notice title=failover_skipped (#3168/#3340)::ts_failover=${ts_failover} go_failover=${go_failover} merge_failover=${merge_failover} reason=primaries_claimed_or_done"
          fi

  # -------------------------------------------------------------------------
  # GH-hosted failover lanes. capacity-arm cancels still-queued Blacksmith
  # primaries via the Jobs API before these start (#2672 / #3168). Avoid
  # concurrency on reusable-workflow caller jobs — it can invalidate the whole
  # workflow graph (0-job failure) when combined with workflow_call.
  # always() + explicit arm flag so a cancelled watchdog cannot leave the
  # graph with no recovery path (arm job re-classifies).
  # -------------------------------------------------------------------------
  ts-failover:
    name: TypeScript (GH-hosted failover)
    needs: [capacity-arm]
    if: always() && needs.capacity-arm.result == 'success' && needs.capacity-arm.outputs.ts_failover == 'true'
    uses: ./.github/workflows/ci-lane.yml
    with:
      suite: ts
      runner: ubuntu-latest

  go-failover:
    name: Go (GH-hosted failover)
    needs: [capacity-arm]
    if: always() && needs.capacity-arm.result == 'success' && needs.capacity-arm.outputs.go_failover == 'true'
    uses: ./.github/workflows/ci-lane.yml
    with:
      suite: go
      runner: ubuntu-latest

  merge-gate-failover:
    name: Merge gate (GH-hosted failover)
    needs: [capacity-arm]
    if: always() && needs.capacity-arm.result == 'success' && needs.capacity-arm.outputs.merge_failover == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base branch for relocation gates
        run: git fetch origin master:refs/remotes/origin/master

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go (toolchain gate in task check)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup uv (toolchain gate in task check)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: task check:merge (merge chokepoint SoT — #1704)
        run: task check:merge
        env:
          GH_TOKEN: ${{ github.token }}
          # #3499 / #747: merge-gate CI is a read-only verification checkout,
          # not authoring. Documented exemption only. Local `task check` /
          # hooks stay fail-closed on master.
          DEFT_ALLOW_DEFAULT_BRANCH_COMMIT: "1"

  # -------------------------------------------------------------------------
  # Authoritative aggregators — ONLY these jobs use the branch-protection
  # required check names. Primary/failover lane names must never collide.
  # When capacity-arm sets WANT_FAILOVER and GH-hosted failover succeeds, the
  # aggregator is green even if the Blacksmith primary was cancelled (#3168/#3340).
  # -------------------------------------------------------------------------
  ts:
    name: TypeScript (build + lint + test)
    needs: [capacity-arm, ts-failover]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve authoritative TypeScript result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          WANT_FAILOVER: ${{ needs.capacity-arm.outputs.ts_failover }}
          FAILOVER_RESULT: ${{ needs.ts-failover.result }}
          PRIMARY_NEEDLE: "typescript (blacksmith primary)"
          SUITE_LABEL: TypeScript
        run: node .github/scripts/resolve-ci-authoritative-lane.mjs

  go:
    name: Go (test + build)
    needs: [changes, capacity-arm, go-failover]
    if: always() && needs.changes.outputs.artifact_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve authoritative Go result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          WANT_FAILOVER: ${{ needs.capacity-arm.outputs.go_failover }}
          FAILOVER_RESULT: ${{ needs.go-failover.result }}
          PRIMARY_NEEDLE: "go (blacksmith primary)"
          SUITE_LABEL: Go
        run: node .github/scripts/resolve-ci-authoritative-lane.mjs

  merge-gate:
    name: Merge gate (task check)
    needs: [changes, capacity-arm, merge-gate-failover]
    if: always() && needs.changes.outputs.artifact_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve authoritative merge-gate result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          WANT_FAILOVER: ${{ needs.capacity-arm.outputs.merge_failover }}
          FAILOVER_RESULT: ${{ needs.merge-gate-failover.result }}
          PRIMARY_NEEDLE: "merge gate (blacksmith primary)"
          SUITE_LABEL: Merge-gate
        run: node .github/scripts/resolve-ci-authoritative-lane.mjs

  windows-task-dispatch:
    # Regression guard for #566 / #2068: task dispatch via absolute Taskfile path
    # must work on Windows. The pre-cutover fixture exercises `migrate:preflight`
    # (TS-native, no Python shell-out). The #593 migrator partition regression
    # invokes scripts/migrate_vbrief.py directly — the task surface no longer
    # ships `migrate:vbrief` on current npm deposits.
    name: Windows (task dispatch regression)
    needs: [changes]
    if: always() && needs.changes.outputs.artifact_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      # #2624: arduino/setup-task can flake on transient GitHub API / CDN errors
      # (rate limits, network blips). Product assertions in this job run only
      # AFTER Task is on PATH — a failed install must still fail the job.
      # Mitigations: pin an exact Task release (avoid resolving 3.x each run),
      # authenticate GitHub API requests via repo-token, and auto-retry once.
      # Operator recovery when only Install Task failed (no code change needed):
      #   gh run rerun <run_id> --failed
      #   gh api -X POST repos/<owner>/<repo>/actions/runs/<run_id>/rerun-failed-jobs
      - name: Install Task
        id: install_task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        continue-on-error: true
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Task (retry transient failure)
        if: steps.install_task.outcome == 'failure'
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Node + pnpm are required because the Wave 8 flip (#1828) repointed the
      # lifecycle gates: `task scope:promote` now `deps: [_ensure-ts]`, which
      # runs `pnpm run build` to compile the TS engine the dispatch invokes via
      # `node packages/cli/dist/bin.js`. Without Node/pnpm on PATH this job
      # failed `scope:_ensure-ts` with exit 127. Node 24 LTS pinned via .nvmrc;
      # corepack activates the pnpm version from package.json `packageManager`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # #1922: `corepack prepare --activate` (run from the repo root, so it
      # reads `packageManager` from package.json) makes the pinned pnpm version
      # the corepack default. The downstream `scope:_ensure-ts` step runs
      # `pnpm --dir <repo> run build` from the consumer-fixture CWD
      # (D:\a\_temp\consumer), which has no `packageManager` pin -- without an
      # activated default, corepack falls back to a newer bundled patch (e.g.
      # 11.9.0) and pnpm hard-fails ("pnpm does not switch versions when running
      # under corepack") because it differs from the repo's pin. Activating the
      # pinned version first keeps the corepack-provided binary in lockstep with
      # the pin regardless of the invocation CWD. No version is hardcoded, so the
      # workflow tracks the package.json pin automatically.
      - name: Enable corepack and activate pinned pnpm
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install Node dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      # #884 + #1070: idempotent ghx pre-install. Windows runner ->
      # upstream install.ps1 downloaded to a temp file, verified against
      # the pinned SHA256 (env.GHX_INSTALL_PS1_SHA256), and dot-sourced
      # only on a checksum match -- replacing the prior `irm | iex` live
      # pipe (#1070 supply-chain quick-win). Both the BINARY and the
      # INSTALLER SCRIPT itself are pinned to ${GHX_VERSION} (closes
      # Greptile #950 P2), AND the installer bytes by SHA256 so an
      # immutable-tag force-move fails the job rather than executing
      # tampered code (#1328). Download + verify is fail-closed; the
      # dot-source install step below keeps the #884 best-effort contract
      # via `continue-on-error: true` (Greptile #950 iteration-2 P1).
      - name: Download and verify ghx installer -- #1070 / #1328
        shell: pwsh
        run: |
          if (Get-Command ghx -ErrorAction SilentlyContinue) {
            Write-Host "ghx already on PATH at $((Get-Command ghx).Source); skipping download."
            exit 0
          }
          $installerUrl = "https://raw.githubusercontent.com/brunoborges/ghx/$env:GHX_VERSION/install.ps1"
          $installer = Join-Path $env:RUNNER_TEMP "ghx-install-$env:GHX_VERSION.ps1"
          try {
            Invoke-WebRequest -Uri $installerUrl -OutFile $installer -UseBasicParsing -ErrorAction Stop
          } catch {
            Write-Host "::warning title=ghx install (#884)::installer download failed: $($_.Exception.Message); gh fallback remains in effect."
            exit 0
          }
          # Verify the installer matches the pinned SHA256 BEFORE any
          # execution. A mismatch on an immutable tag indicates upstream
          # tampering or a CI-side env-var drift -- fail closed (#1328).
          $actual = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          $expected = $env:GHX_INSTALL_PS1_SHA256.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Host "::error title=ghx install (#1070)::install.ps1 SHA256 mismatch (expected $expected, got $actual); refusing to execute."
            Remove-Item -Force $installer -ErrorAction SilentlyContinue
            exit 1
          }
          "GHX_INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # `continue-on-error: true` (closes Greptile #950 iteration-2 P1):
      # PowerShell `try/catch` only intercepts terminating exceptions --
      # a bare `exit N` inside the installer script (on a network /
      # permission failure) bypasses the catch and terminates the
      # PowerShell process with the non-zero exit code. Without
      # `continue-on-error`, that propagates to the job and fails the
      # Windows CI run. Per the documented #884 contract the ghx
      # pre-install MUST be best-effort (the `gh` fallback through
      # scripts/scm.py keeps everything working), so `continue-on-error:
      # true` is scoped to this execute step only -- checksum verify
      # above remains fail-closed (#1328).
      - name: Install ghx (cache proxy for gh) -- #884
        shell: pwsh
        continue-on-error: true
        if: env.GHX_INSTALLER_PATH != ''
        run: |
          if (Get-Command ghx -ErrorAction SilentlyContinue) {
            Write-Host "ghx already on PATH at $((Get-Command ghx).Source); skipping install."
            exit 0
          }
          $installer = $env:GHX_INSTALLER_PATH
          # Dot-source (`.`) preserves caller scope so any `$env:PATH`
          # mutations the installer makes propagate to the post-install
          # `Get-Command ghx` check below. The call operator (`&`) would
          # run the script in a child scope and the PATH mutations would
          # be discarded on scope exit -- matching the failure mode
          # Greptile #1077 P1 flagged. The original `irm | iex` form
          # ran in caller scope via Invoke-Expression, so dot-source
          # restores the original semantic.
          try {
            . $installer
          } catch {
            Write-Host "::warning title=ghx install (#884)::install.ps1 raised: $($_.Exception.Message); gh fallback remains in effect."
          } finally {
            Remove-Item -Force $installer -ErrorAction SilentlyContinue
          }
          if (Get-Command ghx -ErrorAction SilentlyContinue) {
            ghx --version 2>$null
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: task deft:verify:cache-fresh consumer smoke (#2120)
        shell: pwsh
        run: |
          pnpm run build
          if ($LASTEXITCODE -ne 0) {
            throw "pnpm run build exited $LASTEXITCODE"
          }

          $consumer = Join-Path $env:RUNNER_TEMP 'cache-fresh-consumer'
          $core = Join-Path $consumer '.deft\core'
          $shimDir = Join-Path $env:RUNNER_TEMP 'deft-cli-shim'
          New-Item -ItemType Directory -Path $core -Force | Out-Null
          New-Item -ItemType Directory -Path $shimDir -Force | Out-Null

          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'Taskfile.yml') (Join-Path $core 'Taskfile.yml')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'tasks') (Join-Path $core 'tasks') -Recurse

          $consumerTaskfile = @(
            "version: '3'",
            "",
            "includes:",
            "  deft:",
            "    taskfile: ./.deft/core/Taskfile.yml",
            "    optional: true"
          ) -join [Environment]::NewLine
          [System.IO.File]::WriteAllText((Join-Path $consumer 'Taskfile.yml'), $consumerTaskfile, (New-Object System.Text.UTF8Encoding $false))

          $cmdShim = Join-Path $shimDir 'deft.cmd'
          $cmdBody = "@echo off`r`nnode `"$env:GITHUB_WORKSPACE\packages\cli\dist\bin.js`" %*`r`n"
          [System.IO.File]::WriteAllText($cmdShim, $cmdBody, (New-Object System.Text.UTF8Encoding $false))

          $shShim = Join-Path $shimDir 'deft'
          $workspaceSh = $env:GITHUB_WORKSPACE.Replace('\', '/')
          $shBody = "#!/usr/bin/env sh`nnode `"$workspaceSh/packages/cli/dist/bin.js`" `"`$@`"`n"
          [System.IO.File]::WriteAllText($shShim, $shBody, (New-Object System.Text.UTF8Encoding $false))
          if (Get-Command bash -ErrorAction SilentlyContinue) {
            bash -lc "chmod +x '$($shShim.Replace('\', '/'))'"
          }

          $env:PATH = "$shimDir;$env:PATH"

          Push-Location $consumer
          try {
            git init -q
            git config core.autocrlf true
            git -c user.name=ci -c user.email=ci@example.com add -A
            git -c user.name=ci -c user.email=ci@example.com commit -q -m seed

            $directOutput = deft preflight-cache --project-root . --allow-missing-bootstrap 2>&1 | Out-String
            Write-Host "--- direct deft preflight-cache ---"
            Write-Host $directOutput
            if ($LASTEXITCODE -ne 0) {
              throw "deft preflight-cache exited $LASTEXITCODE"
            }

            $taskOutput = task deft:verify:cache-fresh -- --allow-missing-bootstrap 2>&1 | Out-String
            Write-Host "--- task deft:verify:cache-fresh ---"
            Write-Host $taskOutput
            if ($LASTEXITCODE -ne 0) {
              throw "task deft:verify:cache-fresh exited $LASTEXITCODE"
            }
            if ($taskOutput -match 'engine:_ts-build|pnpm\s+.*run build') {
              throw "task deft:verify:cache-fresh reached a build path on a consumer deposit (#2120)"
            }

            $dirtyStatus = git status --short
            if ($dirtyStatus) {
              Write-Host "--- dirty status after cache-fresh smoke ---"
              Write-Host ($dirtyStatus | Out-String)
              throw "cache-fresh smoke left the consumer fixture dirty (#2120)"
            }
          } finally {
            Pop-Location
          }

      - name: Stage pre-cutover fixture as consumer project
        shell: pwsh
        run: |
          $fixtureDir = Join-Path $env:RUNNER_TEMP 'consumer'
          New-Item -ItemType Directory -Path $fixtureDir -Force | Out-Null
          Copy-Item tests\fixtures\pre_cutover_customized\* $fixtureDir -Recurse
          # Drop a vbrief/specification.vbrief.json so migrate:preflight detects
          # pre-cutover state (criterion #3 even with just the root .md files).
          New-Item -ItemType Directory -Path (Join-Path $fixtureDir 'vbrief') -Force | Out-Null
          '{"vBRIEFInfo":{"version":"0.6"},"plan":{"title":"fixture","status":"running","narratives":{},"items":[]}}' | Set-Content -Path (Join-Path $fixtureDir 'vbrief\specification.vbrief.json')
          # Git-init so the migrator's dirty-tree guard is satisfied.
          Push-Location $fixtureDir
          git init -q
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m seed
          Pop-Location
          "fixture=$fixtureDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: task -t Taskfile.yml migrate:preflight (via absolute path, #2068)
        shell: pwsh
        working-directory: ${{ env.fixture }}
        run: |
          $deftTaskfile = Join-Path $env:GITHUB_WORKSPACE 'Taskfile.yml'
          $output = task -t $deftTaskfile migrate:preflight 2>&1 | Out-String
          Write-Host $output
          # go-task surfaces failed task exit codes as 200+N on Windows (exit 1 -> 201).
          if ($LASTEXITCODE -notin @(1, 201)) {
            throw "migrate:preflight expected exit 1 on pre-cutover fixture; got $LASTEXITCODE"
          }
          if ($output -notmatch 'v0\.59\.0') {
            throw "migrate:preflight output missing frozen-release tag v0.59.0 (#2068)"
          }
          Write-Host "migrate:preflight pre-cutover detection OK (#2068)"
          exit 0

      - name: task -t Taskfile.yml scope:promote (end-to-end #577 regression)
        shell: pwsh
        working-directory: ${{ env.fixture }}
        run: |
          $deftTaskfile = Join-Path $env:GITHUB_WORKSPACE 'Taskfile.yml'
          # Stage a proposed scope vBRIEF in the same fixture consumer
          # project used by the migrate:preflight step above.
          # must match the YYYY-MM-DD-<slug>.vbrief.json convention so the
          # scope_lifecycle.py path resolver accepts it end-to-end.
          # xbrief/ layout is required since v0.73.0 (#2112): seed a minimal project
          # so the WIP cap check (countVbriefWip -> resolveLifecycleRoot) can resolve.
          $xbriefActive = Join-Path $env:fixture 'xbrief\active'
          New-Item -ItemType Directory -Path $xbriefActive -Force | Out-Null
          $placeholderJson = '{"xBRIEFInfo":{"version":"0.8","description":"ci-placeholder"},"plan":{"title":"placeholder","status":"running","items":[]}}'
          [System.IO.File]::WriteAllText((Join-Path $xbriefActive 'ci-placeholder.xbrief.json'), $placeholderJson, (New-Object System.Text.UTF8Encoding $false))
          $proposedDir = Join-Path $env:fixture 'xbrief\proposed'
          New-Item -ItemType Directory -Path $proposedDir -Force | Out-Null
          $scopeFile = Join-Path $proposedDir '2026-04-22-scope-cli-args-windows-ci.xbrief.json'
          $scopeJson = '{"xBRIEFInfo":{"version":"0.8","description":"Regression fixture for #577."},"plan":{"title":"scope CLI_ARGS windows CI fixture","status":"proposed","narratives":{},"items":[]}}'
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($scopeFile, $scopeJson, $utf8NoBom)
          # Dispatch scope:promote against a relative path -- this is the
          # exact invocation shape that previously failed on Windows with
          # ``File not found: ...\'.\.xbrief\proposed\<slug>.xbrief.json'``
          # because ``tasks/scope.yml`` wrapped ``{{.CLI_ARGS}}`` in
          # double quotes (#577).
          task -t $deftTaskfile scope:promote -- .\xbrief\proposed\2026-04-22-scope-cli-args-windows-ci.xbrief.json
          if ($LASTEXITCODE -ne 0) { throw "scope:promote exited $LASTEXITCODE" }
          # Assert the file moved from proposed/ to pending/.
          $pendingFile = Join-Path $env:fixture 'xbrief\pending\2026-04-22-scope-cli-args-windows-ci.xbrief.json'
          if (Test-Path $scopeFile) { throw "scope:promote did not remove source file: $scopeFile" }
          if (-not (Test-Path $pendingFile)) { throw "scope:promote did not create target file: $pendingFile" }
          Write-Host "scope:promote end-to-end OK -- $scopeFile -> $pendingFile"

      # #1059: regression guard that the framework:doctor Taskfile wrapper
      # actually reaches `scripts/framework_doctor.py` on Windows. Before
      # this fix `tasks/framework.yml` hardcoded the `python3` executable,
      # which resolves to the Microsoft Store app-execution-alias stub on
      # default-configured Windows hosts and exited 49 before the probe
      # ever ran. After the fix the wrapper is `uv --project ... run
      # python`, which works regardless of whether `python3` is on PATH.
      # The smoke test runs `task framework:doctor` against the deft
      # framework's own root and asserts the documented three-state exit
      # contract (0 clean / 1 drift / 2 config error). Any other exit code
      # (e.g. 49) means the wrapper layer regressed and the probe never
      # ran. The Store-stub failure prints a known marker (`Python was not
      # found; run without arguments to install from the Microsoft Store`)
      # so we also assert it does NOT appear in the output -- a defence-
      # in-depth check in case a future PATH change makes `python3`
      # resolve to a real interpreter on the runner image (in which case
      # the exit code alone would not catch a regression to the bare
      # `python3` form).
      - name: task framework:doctor smoke test (#1059 Windows wrapper regression)
        shell: pwsh
        run: |
          $deftTaskfile = Join-Path $env:GITHUB_WORKSPACE 'Taskfile.yml'
          $output = task -t $deftTaskfile framework:doctor 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Host "--- framework:doctor output (exit=$exit) ---"
          Write-Host $output
          if ($exit -notin @(0, 1, 2)) {
            throw "framework:doctor returned unexpected exit code $exit -- expected 0/1/2 per documented three-state contract; the bare-python3 wrapper regression from #1059 returns 49 on Store-stub hosts"
          }
          if ($output -match 'Python was not found') {
            throw "framework:doctor output contains the Microsoft Store app-execution-alias stub marker -- the #1059 wrapper regression has re-fired"
          }
          Write-Host "framework:doctor smoke OK (#1059) -- exit=$exit, no Store-stub marker in output"

      - name: deft update stays clean with core.autocrlf=true (#2118)
        shell: pwsh
        run: |
          pnpm --dir $env:GITHUB_WORKSPACE run build
          $contentPackage = Join-Path $env:GITHUB_WORKSPACE 'packages\content'
          pnpm --dir $contentPackage run prepack
          $cli = Join-Path $env:GITHUB_WORKSPACE 'packages\cli\dist\bin.js'
          if (-not (Test-Path $cli)) {
            throw "missing built CLI at $cli"
          }
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("deft-update-autocrlf-" + [System.Guid]::NewGuid().ToString('N'))
          $shimDir = Join-Path $smokeRoot 'shim'
          New-Item -ItemType Directory -Path $shimDir -Force | Out-Null
          [System.IO.File]::WriteAllText(
            (Join-Path $shimDir 'deft.cmd'),
            "@echo off`r`nnode `"$cli`" %*`r`n",
            (New-Object System.Text.UTF8Encoding $false)
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $shimDir 'deft'),
            "#!/bin/sh`nnode `"$cli`" " + '"$@"' + "`n",
            (New-Object System.Text.UTF8Encoding $false)
          )
          $hookCli = Join-Path $env:GITHUB_WORKSPACE 'packages\cli\dist\hook-bin.js'
          [System.IO.File]::WriteAllText(
            (Join-Path $shimDir 'deft-hook.cmd'),
            "@echo off`r`nnode `"$hookCli`" %*`r`n",
            (New-Object System.Text.UTF8Encoding $false)
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $shimDir 'deft-hook'),
            "#!/bin/sh`nnode `"$hookCli`" " + '"$@"' + "`n",
            (New-Object System.Text.UTF8Encoding $false)
          )
          if (Get-Command bash -ErrorAction SilentlyContinue) {
            $shShim = Join-Path $shimDir 'deft'
            $hookShShim = Join-Path $shimDir 'deft-hook'
            $env:DEFT_SMOKE_SHIM = $shShim.Replace('\', '/')
            $env:DEFT_SMOKE_HOOK_SHIM = $hookShShim.Replace('\', '/')
            try {
              bash -lc 'chmod +x "$DEFT_SMOKE_SHIM" "$DEFT_SMOKE_HOOK_SHIM"'
              if ($LASTEXITCODE -ne 0) {
                throw "failed to chmod deft shell shims"
              }
            } finally {
              Remove-Item Env:DEFT_SMOKE_SHIM -ErrorAction SilentlyContinue
              Remove-Item Env:DEFT_SMOKE_HOOK_SHIM -ErrorAction SilentlyContinue
            }
          }
          $env:PATH = "$shimDir;$env:PATH"
          $consumer = Join-Path $smokeRoot 'consumer'
          New-Item -ItemType Directory -Path $consumer -Force | Out-Null
          Push-Location $consumer
          try {
            git init -q
            git config core.autocrlf true
            git config user.name ci
            git config user.email ci@example.com
            git switch -c smoke-baseline
            if ($LASTEXITCODE -ne 0) { throw "git switch smoke-baseline exited $LASTEXITCODE" }

            node $cli init --yes --repo-root $consumer
            if ($LASTEXITCODE -ne 0) { throw "directive init exited $LASTEXITCODE" }

            git add -A
            git commit -q -m baseline
            if ($LASTEXITCODE -ne 0) { throw "baseline commit exited $LASTEXITCODE" }

            node $cli update --yes --repo-root $consumer
            if ($LASTEXITCODE -ne 0) { throw "first directive update exited $LASTEXITCODE" }
            node $cli update --yes --repo-root $consumer
            if ($LASTEXITCODE -ne 0) { throw "second directive update exited $LASTEXITCODE" }

            task deft:verify:cache-fresh
            if ($LASTEXITCODE -ne 0) { throw "task deft:verify:cache-fresh exited $LASTEXITCODE" }

            node $cli preflight-cache --project-root $consumer --allow-missing-bootstrap
            if ($LASTEXITCODE -ne 0) { throw "preflight-cache exited $LASTEXITCODE" }

            $status = git status --porcelain
            if ($status) {
              Write-Host "--- dirty status after idempotent update ---"
              Write-Host $status
              throw "directive update left a dirty tree under core.autocrlf=true"
            }
          } finally {
            Pop-Location
            pnpm --dir $contentPackage run postpack
          }
