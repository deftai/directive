name: greenfield-python-free-smoke

on:
  pull_request:
    paths-ignore:
      - "xbrief/completed/**"
      - "CHANGELOG.md"
  push:
    branches: [master, main]
    paths-ignore:
      - "xbrief/completed/**"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install go-task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript workspace
        run: pnpm run build

      - name: Greenfield Python-free smoke (#2022 Phase 3)
        timeout-minutes: 15
        env:
          DEFT_GREENFIELD_SKIP_PREP: "1"
          DEFT_GREENFIELD_OVERALL_TIMEOUT_MS: "840000"
        run: node packages/core/dist/release-e2e/greenfield-python-free-smoke-cli.js
