name: branch-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

# CI sanity check (#747 acceptance criterion E): refuse PRs whose head_ref
# equals the base_ref. master->master PRs slip past every other layer (the
# pre-commit hook can be bypassed locally; verify:branch only runs in
# task check; the typed policy only governs *direct* commits) so this job
# closes the loop at the merge surface.
jobs:
  head-ref-not-equal-base-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse master->master PR
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # Compare lowercased ref names so e.g. `Master` vs `master` is
        # caught (Greptile P2 review on PR #777). GitHub's UI lets users
        # create capitalized branch names; ASCII-fold lowercase covers the
        # cases we care about without pulling in Unicode-aware tooling.
        run: |
          set -eu
          echo "head_ref=$HEAD_REF"
          echo "base_ref=$BASE_REF"
          head_lc=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]')
          base_lc=$(printf '%s' "$BASE_REF" | tr '[:upper:]' '[:lower:]')
          if [ "$head_lc" = "$base_lc" ]; then
            echo "::error title=Branch gate (#747)::head_ref ($HEAD_REF) equals base_ref ($BASE_REF) (case-insensitive). PRs from a branch to itself are refused. Open the PR from a feature branch instead." >&2
            exit 1
          fi
          echo "✓ head_ref ($HEAD_REF) != base_ref ($BASE_REF)"

  # Layer 0 closing-keyword FP lint (#737 / #3969). Fires on body edits too
  # (types include `edited`), which merge-gate does not. Mode fp is the
  # detector that flagged PR #3960 (reason negation).
  closing-keywords:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: pr:check-closing-keywords FP (#737 / #3969)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: task pr:check-closing-keywords -- --pr "$PR_NUMBER" --mode fp
