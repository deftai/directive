version: '3'

# tasks/kill-switch.yml -- the kill record verbs (#6740). `kill-switch:on`
# runs the kept terminal mint and writes `.deft/authz/kill-switch.disable`;
# `kill-switch:off --confirm` removes it with no mint. Both forward
# `{{.CLI_ARGS}}` (here `--confirm`), so per `conventions/task-caching.md` they
# declare no `sources:` / `generates:`. engine-invoke lets these verbs run while
# the record is valid, so the record can always be turned off.

vars:
  DEFT_ROOT: '{{joinPath .TASKFILE_DIR ".."}}'

tasks:
  on:
    desc: "Turn Directive enforcement off for this checkout (#6740). A person runs it at a terminal: it refuses agent or CI shells, non-interactive callers and an active UAT lease, then asks for the typed phrase. -- task kill-switch:on -- --confirm"
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - task: :engine:invoke
        vars:
          ENGINE_CMD: 'kill-switch on --project-root "{{.USER_WORKING_DIR}}" {{.CLI_ARGS}}'

  off:
    desc: "Remove the kill record and turn Directive enforcement back on (#6740). No mint. Then start a new agent session. -- task kill-switch:off -- --confirm"
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - task: :engine:invoke
        vars:
          ENGINE_CMD: 'kill-switch off --project-root "{{.USER_WORKING_DIR}}" {{.CLI_ARGS}}'
