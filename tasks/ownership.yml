version: '3'

# tasks/ownership.yml -- WSL root-runtime ownership doctor/fix (#1617).
# Reachable under mismatch so operators can recover (Bound item 7).

vars:
  DEFT_ROOT: '{{joinPath .TASKFILE_DIR ".."}}'

tasks:
  doctor:
    desc: "Diagnose WSL agent-as-root vs filesystem project-owner mismatch (#1617). Soft so recovery stays reachable. -- task ownership:doctor [-- --project-root PATH] [--owner uid:gid] [--json]"
    dir: '{{.USER_WORKING_DIR}}'
    # No engine:_ts-build: recovery must run before any build that could create
    # root-owned dist under a WSL mismatch (#1617 / Greptile P1).
    env:
      PYTHONUTF8: "1"
    cmds:
      - task: :engine:invoke
        vars:
          ENGINE_CMD: 'ownership:doctor --project-root "{{.USER_WORKING_DIR}}" {{.CLI_ARGS}}'

  fix:
    desc: "Scoped repair of root-owned objects under approved project roots only (#1617). Post-chown re-stat required; no blanket HOME chown. -- task ownership:fix [-- --project-root PATH] [--owner uid:gid] [--json]"
    dir: '{{.USER_WORKING_DIR}}'
    # No engine:_ts-build: same recovery-before-build rule as ownership:doctor.
    env:
      PYTHONUTF8: "1"
    cmds:
      - task: :engine:invoke
        vars:
          ENGINE_CMD: 'ownership:fix --project-root "{{.USER_WORKING_DIR}}" {{.CLI_ARGS}}'
