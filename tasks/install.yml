version: '3'

vars:
  # Per ../Taskfile.yml header: joinPath is evaluated eagerly by go-task
  # templating and yields a native-separator absolute path so {{.DEFT_ROOT}}
  # resolves correctly under node on Windows (#566).
  DEFT_ROOT: '{{joinPath .TASKFILE_DIR ".."}}'

tasks:

  install:
    desc: "OVPR install via global launcher (Go installer deleted AC10.10). Prefer: npm i -g @deftai/directive && directive install"
    cmds:
      - |
        echo "error: task install no longer runs cmd/deft-install (deleted AC10.10)." >&2
        echo "Use: npm i -g @deftai/directive && directive install" >&2
        echo "Wiring-only recovery: npm i -g @deftai/directive && directive install --repair" >&2
        exit 1

  uninstall:
    desc: "Retired (#6022). Run: directive uninstall"
    cmds:
      - |
        echo "error: task uninstall is retired. Run: directive uninstall" >&2
        echo "If the directive command is missing: npm i -g @deftai/directive" >&2
        exit 1

  upgrade:
    desc: "Retired (#6022). Run: directive upgrade"
    cmds:
      - |
        echo "error: task upgrade is retired. Run: directive upgrade" >&2
        echo "If the directive command is missing: npm i -g @deftai/directive" >&2
        exit 1
